[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
upload_speed = 57600

; Configurações para Arduino UNO
board_build.mcu = atmega328p
board_build.f_cpu = 16000000L

; Biblioteca necessária para comunicação serial
lib_deps = 

; Configurações de monitoramento
monitor_filters = 
    time
    default

; Configurações de upload
upload_protocol = arduino
upload_port = auto

; Configurações de build
build_flags = 
    -DDEBUG=1
    -DBAUD_RATE=115200

; Configurações de debug (opcional)
debug_tool = avr-stub
debug_init_break = tbreak setup
